<!doctype html>
<!--
  Map of the countries with electricity demand data. The data comes from
  sources.json, which scripts/build.py generates next to this page.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Demand Map</title>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="legend">
      <h4>Years of available data</h4>
      <div><span style="background-color: #b2d8b2"></span> 0–4</div>
      <div><span style="background-color: #67b367"></span> 5–9</div>
      <div><span style="background-color: #267326"></span> 10–19</div>
      <div><span style="background-color: #0d400d"></span> 20+</div>
      <div>
        <span style="background-color: #e0e0e0"></span> Searched, none found
      </div>
      <div>
        <span style="background-color: #aaaaaa"></span> Not searched yet
      </div>
    </div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="script.js"></script>
  </body>
</html>
