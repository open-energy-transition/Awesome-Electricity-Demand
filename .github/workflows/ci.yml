# Runs the pre-commit hooks, the tests and mypy on pull requests and on
# pushes to main, and checks that the data files are valid and that
# README.md matches them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    timeout-minutes: 15
    name: "pre-commit"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: "Cache the hook environments"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The tests job checks the types with the project's dependencies.
      - name: "Run the hooks"
        env:
          SKIP: mypy
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

  tests:
    timeout-minutes: 15
    name: "tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: "Check the data files and README.md"
        run: uv run --locked scripts/build.py check

      - name: "Run the tests"
        run: uv run --locked pytest

      - name: "Check the types"
        run: uv run --locked mypy

      - name: "Build the site"
        run: uv run --locked scripts/build.py site _site
