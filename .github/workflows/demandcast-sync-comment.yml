# Posts the comment of the comparison with DemandCast on a pull request,
# and adds or removes the demandcast-sync label, after the workflow
# "DemandCast sync". It runs with the permissions of the base repository,
# so that it can also comment on pull requests from forks: it never checks
# out or runs their code, it reads only the report of the comparison, and
# it posts only on the pull request whose head is the commit compared.

name: DemandCast sync comment

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] - see the comment above.
    workflows: ["DemandCast sync"]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: "Comment on the pull request"
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read # Download the report of the comparison.
      issues: write # Create the label.
      pull-requests: write # Comment on and label the pull request.
    steps:
      - name: "Download the report"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demandcast-sync-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report

      - name: "Comment and label"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LABEL: demandcast-sync
        run: |
          number="$(cat report/pr_number)"
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::The report has no valid number of pull request."
            exit 1
          fi
          head="$(gh pr view "$number" --json headRefOid --jq .headRefOid)"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::notice::Pull request $number has a newer commit: nothing to post."
            exit 0
          fi

          comment_id="$(gh api "repos/$GH_REPO/issues/$number/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- demandcast-sync -->")) | .id' | head -n 1)"
          if [ -f report/comment.md ]; then
            if [ -n "$comment_id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" \
                -F body=@report/comment.md > /dev/null
            else
              gh pr comment "$number" --body-file report/comment.md
            fi
            gh label create "$LABEL" --force --color FBCA04 \
              --description "Divergences from the data sources of DemandCast"
            gh pr edit "$number" --add-label "$LABEL"
          else
            if [ -n "$comment_id" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/comments/$comment_id"
            fi
            gh pr edit "$number" --remove-label "$LABEL" || true
          fi
