# Compares the data sources of the list with those of DemandCast, which
# every source of DemandCast should be in. On main, after each change of
# the data and every month, it keeps one issue open with the divergences
# that are not accepted. On pull requests that change the data, it reports
# the divergences that they add or resolve as warnings, and saves a comment
# that the workflow "DemandCast sync comment" posts. A divergence never
# fails the workflow.

name: DemandCast sync

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/demandcast_sync.py"
      - "scripts/registry.py"
      - ".github/workflows/demandcast-sync.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/demandcast_sync.py"
      - "scripts/registry.py"
      - ".github/workflows/demandcast-sync.yml"
  schedule:
    - cron: "13 5 3 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  compare:
    name: "Compare with DemandCast"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Check out the data sources of DemandCast"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-energy-transition/demandcast
          path: demandcast
          sparse-checkout: demandcast/retrievals/electricity_demand_data_sources
          persist-credentials: false

      - name: "Check out the data of the base branch"
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: data
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: "Compare"
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args=(
            --demandcast demandcast/demandcast/retrievals/electricity_demand_data_sources
            --output sync
          )
          if [ "$EVENT" = pull_request ]; then
            args+=(--base-data base/data)
          fi
          uv run --locked scripts/demandcast_sync.py "${args[@]}"

      - name: "Write the summary"
        run: cat sync/demandcast_sync_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Save the number of the pull request"
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > sync/pr_number

      - name: "Upload the report"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demandcast-sync-report
          path: sync/
          if-no-files-found: error
          retention-days: 30

  # Runs without the code: it only reads the report.
  report:
    name: "Report the divergences"
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: compare
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      issues: write # Open, update and close the tracking issue.
    steps:
      - name: "Download the report"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demandcast-sync-report

      - name: "Open, update or close the tracking issue"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: demandcast-sync
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          divergences="$(jq '[.findings[] | select(.open)] | length' demandcast_sync_report.json)"
          issue="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ "$divergences" -gt 0 ]; then
            {
              echo
              echo "Updated by the [comparison with DemandCast]($RUN_URL)." \
                "A divergence stays here until one of the repositories" \
                "changes, or it is added with a reason to" \
                "\`data/demandcast_differences.yaml\`. This issue is closed" \
                "when no divergence is open."
            } >> demandcast_sync_report.md
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file demandcast_sync_report.md
            else
              gh label create "$LABEL" --force --color FBCA04 \
                --description "Divergences from the data sources of DemandCast"
              gh issue create --label "$LABEL" \
                --title "Divergences from the data sources of DemandCast" \
                --body-file demandcast_sync_report.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment \
              "The list and DemandCast agree, or their differences are accepted ([comparison]($RUN_URL))."
          fi
